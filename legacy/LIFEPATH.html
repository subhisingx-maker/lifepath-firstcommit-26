<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFEPATH – From confusion to completion</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--navy:#17243A;--ind:#5665D8;--lav:#EEF0FF;--bg:#F8F9FC;--card:#fff;--ok:#239B74;--warn:#D99B35;--err:#D85D5D;--tx:#17243A;--mut:#56627A;--bd:#DFE3EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1726;--card:#17243A;--lav:#222F52;--tx:#EEF1F8;--mut:#A9B3C8;--bd:#2D3B58;--ind:#8E9BFF}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5rem}h1{font-size:clamp(2.2rem,6vw,3.6rem)}h2{font-size:1.7rem}h3{font-size:1.15rem}
p{margin:.3rem 0 .8rem}a{color:var(--ind)}.mut{color:var(--mut)}.sm{font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-block;border:1px solid var(--ind);background:var(--ind);color:#fff;padding:.6rem 1.1rem;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none}
.btn.sec{background:transparent;color:var(--ind)}.btn.sm{padding:.3rem .7rem;font-size:.9rem}.btn.danger{background:var(--err);border-color:var(--err)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(23,36,58,.06)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
label{display:block;font-weight:500;margin:.7rem 0 .2rem}input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.demo{background:#FFF4DC;color:#6B4500;border:1px solid var(--warn);border-radius:10px;padding:.5rem .8rem;font-weight:600;font-size:.9rem;margin-bottom:1rem}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.b-VERIFIED,.b-completed,.b-mandatory{color:var(--ok)}.b-UNVERIFIED,.b-pending,.b-optional,.b-notspec{color:var(--mut)}.b-NEEDS,.b-attention,.b-conditional,.b-CONFLICT{color:var(--warn)}.b-NOTFOUND{color:var(--err)}.b-progress{color:var(--ind)}
.bar{height:10px;border-radius:9px;background:var(--lav);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
/* layout */
#app{display:flex;min-height:100vh}nav.side{width:230px;background:var(--navy);color:#fff;padding:1rem;position:sticky;top:0;height:100vh;flex-shrink:0}
nav.side a{display:block;color:#D8DDF0;text-decoration:none;padding:.55rem .7rem;border-radius:9px;margin:2px 0}nav.side a.on,nav.side a:hover{background:#2A3A58;color:#fff}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:1.4rem;letter-spacing:.04em;color:#fff;text-decoration:none;display:block;margin:.2rem .4rem 1rem}.logo b{color:#9AA6FF}
main{flex:1;min-width:0;padding:1.5rem;max-width:980px;margin:0 auto;width:100%}
.top{display:none}
@media(max-width:760px){#app{display:block}nav.side{position:fixed;left:0;right:0;top:0;bottom:auto;width:auto;height:auto;z-index:5;display:none;padding-top:4rem}nav.side.open{display:block}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--navy);padding:.6rem 1rem;position:sticky;top:0;z-index:6}.top button{background:none;border:1px solid #5a6a8c;color:#fff;border-radius:8px;padding:.3rem .7rem}main{padding:1rem}}
/* landing */
.land{max-width:1000px;margin:0 auto;padding:1.5rem}.hero{padding:3rem 0 2rem}.hero p.lead{font-size:1.2rem;max-width:34rem}
.mark{font-family:Fraunces,serif;font-weight:700;letter-spacing:.06em}
.step{border-left:4px solid var(--bd)}.step.s-completed{border-left-color:var(--ok)}.step.s-progress{border-left-color:var(--ind)}.step.s-attention{border-left-color:var(--warn)}.step.locked{opacity:.65}
details summary{cursor:pointer;font-weight:600}blockquote{margin:.4rem 0;padding:.4rem .8rem;border-left:3px solid var(--ind);background:var(--lav);border-radius:6px;font-size:.92rem}
.drop{border:2px dashed var(--ind);border-radius:16px;padding:2rem;text-align:center;background:var(--lav);cursor:pointer}.drop.over{background:#dfe3ff}
.chat{display:flex;flex-direction:column;gap:.7rem}.q{align-self:flex-end;background:var(--ind);color:#fff;padding:.5rem .8rem;border-radius:12px;max-width:85%}.a{background:var(--card);border:1px solid var(--bd);padding:.8rem;border-radius:12px}
.toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:20}.toast.e{background:var(--err)}
.tw{overflow-x:auto}
</style></head><body>
<div id="root"></div>
<script>
/* ---------- State ---------- */
const KEY='lifepath.v1';
let S={journeys:[],activeId:null,askLog:{},checklistNote:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save in this browser. Progress may be lost on refresh.',1)}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' e':'');t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const active=()=>S.journeys.find(j=>j.id===S.activeId)||null;
const LBL={VERIFIED:'Verified',UNVERIFIED:'Unverified',NEEDS:'Needs review',NOTFOUND:'Not found',CONFLICT:'Conflict'};
const vb=v=>`<span class="badge b-${v}">${LBL[v]}</span>`;
const SL={pending:'Pending',progress:'In progress',completed:'Completed',attention:'Needs attention'};

/* ---------- Demo data (fictional) ---------- */
const DEMO_PAGES=[
`DEMO DATA - NOT AN OFFICIAL UNIVERSITY NOTIFICATION. Demo National University. Admission Notification 2027-28 for Bachelor of Science. Eligibility: Candidates must have passed Class 12 with Physics, Chemistry and Mathematics or Biology. Candidates must have a minimum of 50% aggregate marks (fictional rule).`,
`Documents required. Mandatory: Class 12 marksheet. Mandatory: Photo ID proof. Mandatory: Passport-size photograph in JPG format, maximum 100 KB. Conditional: Category certificate is required only if the candidate is claiming a reserved seat. Conditional: Migration certificate is required only if the Class 12 board is outside the home state. Optional: Extracurricular certificates may be uploaded for the profile section.`,
`Registration: Register on the Demo Admissions Portal using an email address and mobile number between 1 February 2027 and 28 February 2027 (fictional dates). Application form: After registration, fill in academic details, upload the required documents, pay the application fee and submit the form by 15 March 2027 (fictional date).`,
`Merit list: The merit list will be published on 1 April 2027 (fictional date). Selected candidates must accept the seat within 5 days, pay the admission fee and bring original documents for verification. Candidates who are not selected may check the waitlist notice. This notice does not specify any other steps for candidates who are not selected.`];
const mk=(id,title,desc,why,instr,docs,deadline,page,dep,branch)=>({id,title,desc,why,instr,docs,deadline,page,dep:dep||[],branch:branch||null,status:'pending',ver:'VERIFIED'});
function demoJourney(){return{id:uid(),demo:true,name:'Demo: B.Sc. at Demo National University',uni:'Demo National University',course:'Bachelor of Science',year:'2027-28',type:'Undergraduate admission',outcome:null,mode:'Bundled demo data',
sources:[{name:'Demo admission notification (fictional)',url:'',pages:DEMO_PAGES}],
eligibility:[{t:'Passed Class 12 with Physics, Chemistry and Mathematics or Biology',page:1,ver:'VERIFIED'},{t:'Minimum 50% aggregate marks (fictional rule)',page:1,ver:'VERIFIED'}],
docs:[{id:'d1',name:'Class 12 marksheet',type:'mandatory',why:'Proves you meet the eligibility condition.',cond:null,fmt:'',page:2,ready:false,ver:'VERIFIED'},
{id:'d2',name:'Photo ID proof',type:'mandatory',why:'Confirms your identity.',cond:null,fmt:'',page:2,ready:false,ver:'VERIFIED'},
{id:'d3',name:'Passport-size photograph',type:'mandatory',why:'Used on the application form.',cond:null,fmt:'JPG, max 100 KB',page:2,ready:false,ver:'VERIFIED'},
{id:'d4',name:'Category certificate',type:'conditional',why:'Needed only to claim a reserved seat.',cond:'Only if claiming a reserved seat',fmt:'',page:2,ready:false,ver:'VERIFIED'},
{id:'d5',name:'Migration certificate',type:'conditional',why:'Needed when the Class 12 board is outside the home state.',cond:'Only if board is outside home state',fmt:'',page:2,ready:false,ver:'VERIFIED'},
{id:'d6',name:'Extracurricular certificates',type:'optional',why:'Used for the profile section.',cond:null,fmt:'',page:2,ready:false,ver:'VERIFIED'}],
warnings:[{t:'All dates and rules here are fictional and for demonstration only.',page:1}],
steps:[
mk('s1','Check your eligibility','Make sure you meet the basic conditions before spending time on the form.','Applying without meeting eligibility wastes the fee and effort.','Compare your Class 12 subjects and aggregate marks with the eligibility section.','','',1),
mk('s2','Gather your documents','Collect the mandatory documents, plus any conditional ones that apply to you.','Missing documents can stop your application later.','Use the Documents checklist and mark each one ready.','Class 12 marksheet, Photo ID, Photograph','',2,['s1']),
mk('s3','Register on the portal','Create your account on the admissions portal.','Registration is what lets you open the application form.','Register with an email address and mobile number.','','1 Feb 2027 – 28 Feb 2027 (fictional)',3,['s1']),
mk('s4','Fill and submit the application form','Enter academic details, upload documents, pay the fee and submit.','Only submitted forms are considered for the merit list.','Fill in academic details, upload documents, pay the application fee, submit.','All mandatory documents','15 Mar 2027 (fictional)',3,['s2','s3']),
mk('s5','Check the merit list','See whether your name appears when the merit list is published.','The result decides which steps come next.','Open the merit list on the portal and then record your result below.','','1 Apr 2027 (fictional)',4,['s4']),
mk('s6','Accept your seat','Confirm that you want the seat you were offered.','An unaccepted seat may be given to someone else.','Accept the seat on the portal.','','Within 5 days of the merit list (fictional)',4,['s5'],'selected'),
mk('s7','Pay the admission fee','Pay the admission fee to hold your seat.','The seat is not secured without payment.','Pay through the portal.','','Within 5 days of the merit list (fictional)',4,['s6'],'selected'),
mk('s8','Verify original documents','Bring your original documents for verification.','Your admission is confirmed only after verification.','Carry the originals of the documents you uploaded.','Originals of all uploaded documents','',4,['s7'],'selected'),
mk('s9','Check the waitlist notice','See whether you appear on the waitlist notice.','It is the only option this notice mentions if you are not selected.','Look for the waitlist notice on the portal. This notice lists no other steps.','','',4,['s5'],'not')]}}

/* ---------- Rule-based extraction (NOT an AI model) ---------- */
function extract(pages,name){
 const sents=[];pages.forEach((p,i)=>p.split(/(?<=[.;])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>8).forEach(x=>sents.push({t:x,page:i+1})));
 const dateRe=/\b\d{1,2}(st|nd|rd|th)?\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{4}|\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/gi;
 const full=pages.join(' ');
 const uni=(full.match(/([A-Z][A-Za-z.&]+(?:\s+[A-Z][A-Za-z.&]+){0,4}\s+(?:University|Institute|College))/)||[])[1]||'';
 const year=(full.match(/\b20\d\d\s*[-–\/]\s*\d{2,4}\b/)||[])[0]||'';
 const course=(full.match(/\b(Bachelor|Master)s?\s+of\s+[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?|\b(B\.?Sc|B\.?A|B\.?Com|B\.?Tech|M\.?Sc|M\.?A|M\.?Tech)\b\.?/)||[])[0]||'';
 const elig=sents.filter(s=>/eligib|minimum|must have|should have|passed/i.test(s.t)).slice(0,8).map(s=>({t:s.t,page:s.page,ver:'UNVERIFIED'}));
 const docs=[];const docRe=/(marksheet|mark sheet|certificate|photograph|photo|id proof|identity|passport|signature|transfer|domicile|income|document)/i;
 sents.filter(s=>docRe.test(s.t)&&/mandatory|required|must|optional|submit|upload|if |only|where applicable/i.test(s.t)).slice(0,14).forEach((s,i)=>{
  const t=/optional/i.test(s.t)?'optional':/\bif\b|only|where applicable|applicable/i.test(s.t)?'conditional':/mandatory|required|must/i.test(s.t)?'mandatory':'notspec';
  const nm=(s.t.match(/([A-Za-z0-9\- ]{0,30}(?:marksheet|mark sheet|certificate|photograph|photo|id proof|passport|signature|domicile)[A-Za-z\- ]{0,15})/i)||[s.t.slice(0,60)])[0].replace(/^(mandatory|conditional|optional|and|or|the)[:\s]+/i,'').trim();
  docs.push({id:'d'+i,name:nm.charAt(0).toUpperCase()+nm.slice(1),type:t,why:'Mentioned in the notice: "'+s.t.slice(0,140)+(s.t.length>140?'…':'')+'"',cond:t==='conditional'?'See source text':null,fmt:(s.t.match(/(?:max(?:imum)?\.?\s*)?\d+\s*(?:KB|MB)|JPG|JPEG|PDF|PNG/gi)||[]).join(', '),page:s.page,ready:false,ver:'UNVERIFIED'})});
 const stages=[['Register','register|registration|sign up'],['Fill the application form','application form|apply|fill'],['Pay the fee','pay|fee'],['Submit the application','submit'],['Check the merit list or result','merit|result|allotment|selection list'],['Confirm admission','accept|confirm|admission fee|seat'],['Document verification','verif|original']];
 const steps=[];stages.forEach(([title,re])=>{const m=sents.find(s=>new RegExp(re,'i').test(s.t)&&!steps.some(x=>x.src===s.t));if(m){const n=steps.length;steps.push(Object.assign(mk('s'+(n+1),title,m.t.slice(0,220),'Mentioned in the uploaded notice.',m.t,'',(m.t.match(dateRe)||[]).join(' – '),m.page,n?['s'+n]:[]),{ver:'NEEDS',src:m.t}))}});
 const deadlines=sents.filter(s=>dateRe.test(s.t)).map(s=>({t:s.t,page:s.page}));
 const warn=sents.filter(s=>/note|warning|important|not specif|exception|failure|rejected|cancel/i.test(s.t)).slice(0,6).map(s=>({t:s.t,page:s.page}));
 const unc=[];if(!uni)unc.push('University name not found');if(!year)unc.push('Academic year not found');if(!course)unc.push('Programme not found');if(!elig.length)unc.push('No eligibility text found');if(!docs.length)unc.push('No document requirements found');if(steps.length<3)unc.push('Fewer than 3 application stages found');
 return{uni,year,course,elig,docs,steps,deadlines,warn,unc,low:unc.length>=2||steps.length<3}}
function validate(x){const e=[];if(!x||typeof x!=='object')return['Extraction returned nothing.'];['elig','docs','steps','deadlines','warn','unc'].forEach(k=>{if(!Array.isArray(x[k]))e.push('Missing field: '+k)});(x.steps||[]).forEach((s,i)=>{if(!s.title||!s.page)e.push('Step '+(i+1)+' is missing a title or page reference')});return e}

/* ---------- Helpers ---------- */
const applicable=j=>j.steps.filter(s=>!s.branch||s.branch===j.outcome);
const prog=j=>{const a=applicable(j);return a.length?Math.round(a.filter(s=>s.status==='completed').length/a.length*100):0};
const locked=(j,s)=>s.dep.some(d=>{const p=j.steps.find(x=>x.id===d);return p&&p.status!=='completed'});
const nextStep=j=>applicable(j).find(s=>s.status!=='completed'&&!locked(j,s));
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const need=()=>{const j=active();if(!j){return`<div class="card"><h3>No journey yet</h3><p class="mut">Start one, or explore the fictional sample to see how LIFEPATH works.</p><a class="btn" href="#start">Start a journey</a> <button class="btn sec" onclick="trySample()">Try sample admission journey</button></div>`}return null};
function trySample(){let j=S.journeys.find(x=>x.demo);if(!j){j=demoJourney();S.journeys.push(j)}S.activeId=j.id;save();location.hash='roadmap';toast('Sample journey loaded')}
window.trySample=trySample;

/* ---------- Views ---------- */
const V={};
V.landing=()=>`<div class="land"><div class="row sp"><span class="mark" style="font-size:1.4rem">LIFE<b style="color:var(--ind)">PATH</b></span><a class="btn sec sm" href="#dashboard">Open app</a></div>
<section class="hero"><h1>From confusion to completion.</h1><p class="lead">Your application journey, simplified. Understand requirements, prepare documents and know exactly what to do next.</p>
<div class="row"><a class="btn" href="#start">Start My Journey</a><a class="btn sec" href="#how">Explore How It Works</a><button class="btn sec" onclick="trySample()">Try Sample Admission Journey</button></div></section>
<section class="card"><h2>The problem</h2><p>Admission rules sit in portals, PDF notices, prospectuses and merit-list announcements. Each one is public, but few students can connect them into one clear path.</p></section>
<section id="how"><h2>How it works</h2><div class="grid">
<div class="card"><h3>1. Add a notice</h3><p>Upload a text-based PDF, paste text, or open the sample.</p></div>
<div class="card"><h3>2. Get a roadmap</h3><p>Steps appear in order. Steps that depend on earlier ones stay locked until those are done.</p></div>
<div class="card"><h3>3. Track and ask</h3><p>Tick off steps and documents. Ask questions answered only from your notice, with page references.</p></div></div></section>
<section class="card"><h2>Why source-backed guidance</h2><p>Every requirement shows the document and page it came from, plus a status: Verified, Unverified, Needs review, Not found or Conflict. Extracted information is never marked Verified automatically.</p></section>
<section class="card"><h2>Privacy and reliability</h2><p>Your journeys and checklist are stored only in this browser. PDF text is read on your device and not sent anywhere. LIFEPATH never presents its own simplified wording as an official instruction. For critical decisions, confirm on the university’s official site.</p></section>
<section><h2>Frequently asked questions</h2>
<details class="card"><summary>Is LIFEPATH official?</summary><p>No. It helps you understand official documents. It is not affiliated with any university.</p></details>
<details class="card"><summary>Does it use AI?</summary><p>This version uses rule-based extraction and keyword search, and says so on every result. A live AI model needs a server and an API key, which this hosted page does not have.</p></details>
<details class="card"><summary>Can it read scanned PDFs or images?</summary><p>Not yet. Scanned files need OCR, which is not available here. You will see a clear message instead of a guess.</p></details></section></div>`;
V.how=()=>{location.hash='landing'};
V.dashboard=()=>{const j=active();let h=`<h1>Welcome</h1><p class="mut">Here is where your application stands.</p>`;
 if(!j)return h+need()+`<div class="card"><h3>Add a document</h3><p class="mut">Upload an admission notice to build your own roadmap.</p><a class="btn sec" href="#upload">Upload a document</a></div>`;
 const p=prog(j),n=nextStep(j),a=applicable(j),dl=a.filter(s=>s.deadline&&s.status!=='completed');
 const dr=j.docs.filter(d=>d.type==='mandatory');const rd=dr.filter(d=>d.ready).length;
 h+=(j.demo?`<div class="demo">DEMO DATA — NOT AN OFFICIAL UNIVERSITY NOTIFICATION.</div>`:'')+`<div class="card"><div class="row sp"><div><h3>${esc(j.name)}</h3><span class="mut sm">${esc(j.type)} · ${esc(j.year||'Year not found')}</span></div><strong>${p}%</strong></div>${bar(p)}<p class="sm mut">${a.filter(s=>s.status==='completed').length} of ${a.length} steps completed</p></div>
<div class="card"><h3>Recommended next action</h3>${n?`<p><strong>${esc(n.title)}</strong> – ${esc(n.desc)}</p><a class="btn" href="#roadmap">Open roadmap</a>`:(j.outcome||!j.steps.some(s=>s.branch)?'<p>All available steps are done.</p>':'<p>Record your merit-list result on the roadmap to see what comes next.</p><a class="btn" href="#roadmap">Open roadmap</a>')}</div>
<div class="grid"><div class="card"><h3>Pending</h3>${a.filter(s=>s.status!=='completed').slice(0,5).map(s=>`<div class="sm">• ${esc(s.title)} ${locked(j,s)?'<span class="mut">(locked)</span>':''}</div>`).join('')||'<p class="mut sm">Nothing pending.</p>'}</div>
<div class="card"><h3>Upcoming deadlines</h3>${dl.map(s=>`<div class="sm"><strong>${esc(s.title)}</strong><br>${esc(s.deadline)}</div>`).join('')||'<p class="mut sm">No deadlines found in the documents.</p>'}</div>
<div class="card"><h3>Document readiness</h3><p>${rd} of ${dr.length} mandatory documents ready</p><a class="btn sec sm" href="#checklist">Open checklist</a></div></div>
<div class="row"><a class="btn sec" href="#upload">Upload a document</a><a class="btn sec" href="#start">Start another journey</a></div>`;return h};
V.start=()=>`<h1>Start a journey</h1><div class="card"><h3>No documents yet?</h3><p class="mut">Open the fictional Demo National University journey. No personal information needed.</p><button class="btn" onclick="trySample()">Try Sample Admission Journey</button></div>
<form class="card" id="sf"><h3>Create your own</h3><p class="mut sm">Only what is needed to label your journey. Rules and dates come from documents you add, never from LIFEPATH.</p>
<label for="f1">Application goal</label><select id="f1"><option>Undergraduate admission</option><option>Postgraduate admission</option><option>Scholarship application</option><option>Entrance examination</option></select>
<label for="f2">State</label><input id="f2" placeholder="e.g. Bihar"><label for="f3">University or institution *</label><input id="f3" required>
<label for="f4">Course or programme *</label><input id="f4" required><label for="f5">Academic year</label><input id="f5" placeholder="e.g. 2027-28"><label for="f6">Application type</label><input id="f6" placeholder="e.g. Merit-based, entrance-based">
<label for="f7">Anything else about your situation (optional)</label><textarea id="f7" rows="2" placeholder="e.g. applying under a reserved category"></textarea>
<p class="sm mut">Undergraduate admission has the fullest support in this version. Other goals use the same document-based flow.</p><button class="btn" type="submit">Create journey</button></form>`;
V.upload=()=>`<h1>Add a document</h1><p class="mut">Add an admission notice. LIFEPATH reads it and builds a roadmap you can review.</p>
<div class="card"><div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file"><strong>Drag a PDF here or click to choose</strong><p class="mut sm">Text-based PDF or image · max 10 MB</p></div><input type="file" id="file" accept=".pdf,image/png,image/jpeg" hidden><div id="fstat" aria-live="polite"></div></div>
<div class="card"><h3>Paste text</h3><textarea id="ptxt" rows="6" placeholder="Paste the notice text. Use [Page 2] on its own line to mark page breaks."></textarea><div class="row"><button class="btn" id="ptb">Process text</button></div></div>
<div class="card"><h3>Link to a notice</h3><input id="url" placeholder="https://…"><p class="sm mut">This page cannot download other websites. Your link is saved as the official source, and you can paste the text above.</p><button class="btn sec" id="urlb">Save link as source</button></div>
<div id="review"></div>`;
V.roadmap=()=>{const j=active();const nj=need();if(nj)return`<h1>Roadmap</h1>`+nj;
 const p=prog(j);let h=`<div class="row sp"><h1>Roadmap</h1><strong>${p}%</strong></div>${j.demo?`<div class="demo">DEMO DATA — NOT AN OFFICIAL UNIVERSITY NOTIFICATION.</div>`:''}<p class="mut">${esc(j.name)}</p>${bar(p)}<br>`;
 const card=s=>{const lk=locked(j,s);const blockers=s.dep.map(d=>j.steps.find(x=>x.id===d)).filter(x=>x&&x.status!=='completed').map(x=>x.title);
  return`<div class="card step s-${s.status} ${lk?'locked':''}"><div class="row sp"><h3>${esc(s.title)}</h3><span class="row"><span class="badge b-${s.status}">${SL[s.status]}</span>${vb(s.ver)}</span></div>
  <p>${esc(s.desc)}</p>${lk?`<p class="sm"><strong>Locked:</strong> finish “${esc(blockers.join('”, “'))}” first.</p>`:''}
  <details><summary>Why it matters and how to do it</summary><p><strong>Why:</strong> ${esc(s.why)}</p><p><strong>Instructions:</strong> ${esc(s.instr)}</p>${s.docs?`<p><strong>Documents:</strong> ${esc(s.docs)}</p>`:''}</details>
  <p class="sm">${s.deadline?`<strong>Deadline:</strong> ${esc(s.deadline)} · `:'<span class="mut">No deadline found · </span>'}Source: ${esc(j.sources[0]?.name||'Not found')}, page ${esc(s.page)}</p>
  <div class="row">${s.status==='completed'?`<button class="btn sec sm" onclick="setS('${s.id}','pending')">Undo completion</button>`:`<button class="btn sm" ${lk?'disabled':''} onclick="setS('${s.id}','completed')">Mark complete</button>`}
  <button class="btn sec sm" ${lk?'disabled':''} onclick="setS('${s.id}','progress')">In progress</button><button class="btn sec sm" onclick="setS('${s.id}','attention')">Needs attention</button></div></div>`};
 j.steps.filter(s=>!s.branch).forEach(s=>h+=card(s));
 if(j.steps.some(s=>s.branch)){h+=`<div class="card"><h3>What was your merit-list result?</h3><p class="sm mut">Complete “Check the merit list” first, then record the outcome. Only steps this notice describes for that outcome are shown.</p><div class="row"><button class="btn ${j.outcome==='selected'?'':'sec'} sm" onclick="setO('selected')">I was selected</button><button class="btn ${j.outcome==='not'?'':'sec'} sm" onclick="setO('not')">I was not selected</button>${j.outcome?`<button class="btn sec sm" onclick="setO(null)">Clear</button>`:''}</div></div>`;
  j.steps.filter(s=>s.branch&&s.branch===j.outcome).forEach(s=>h+=card(s))}
 return h};
V.checklist=()=>{const j=active();const nj=need();if(nj)return`<h1>Documents</h1>`+nj;
 const grp=[['mandatory','Mandatory'],['conditional','Conditional'],['optional','Optional'],['notspec','Not specified']];
 let h=`<h1>Document checklist</h1><p class="mut">Marking a document ready only records it for you. Nothing is uploaded.</p>`;
 const ready=j.docs.filter(d=>d.ready);
 if(!j.docs.length)h+=`<div class="card"><p>No documents were found in the sources. Check the official notice or add another document.</p></div>`;
 grp.forEach(([k,l])=>{const L=j.docs.filter(d=>d.type===k&&!d.ready);if(L.length)h+=`<h2>${l}</h2>`+L.map(dc).join('')});
 if(ready.length)h+=`<h2>Already prepared</h2>`+ready.map(dc).join('');
 return h;function dc(d){return`<div class="card"><div class="row sp"><h3>${esc(d.name)}</h3><span class="row"><span class="badge b-${d.type==='notspec'?'notspec':d.type}">${d.type==='notspec'?'Not specified':d.type}</span>${vb(d.ver)}</span></div><p>${esc(d.why)}</p>${d.cond?`<p class="sm"><strong>When:</strong> ${esc(d.cond)}</p>`:''}${d.fmt?`<p class="sm"><strong>Format:</strong> ${esc(d.fmt)}</p>`:''}<p class="sm mut">Source: ${esc(j.sources[0]?.name||'')}, page ${esc(d.page)}</p><button class="btn ${d.ready?'sec':''} sm" onclick="togDoc('${d.id}')">${d.ready?'Mark not ready':'Mark ready'}</button></div>`}};
V.ask=()=>{const j=active();const nj=need();if(nj)return`<h1>Ask LIFEPATH</h1>`+nj;const log=S.askLog[j.id]||[];
 return`<h1>Ask LIFEPATH</h1><p class="mut">Answers use only the documents in this journey: <strong>${esc(j.sources.map(s=>s.name).join(', '))}</strong>. This version finds matching passages by keyword; it is not a live AI model.</p>
<div class="chat" id="chat">${log.map(m=>m.q?`<div class="q">${esc(m.q)}</div>`:`<div class="a">${m.a}</div>`).join('')||'<p class="mut">Try: “Is the category certificate compulsory?” or “What happens after the merit list?”</p>'}</div><br>
<form class="row" id="af"><input id="aq" aria-label="Your question" placeholder="Ask about this application…" style="flex:1;min-width:200px"><button class="btn" type="submit">Ask</button></form>
<div class="row" style="margin-top:.6rem">${['Which documents are mandatory?','What is the deadline?','What happens after the merit list?','Am I eligible?'].map(q=>`<button class="btn sec sm" onclick="ask('${q}')">${q}</button>`).join('')}</div>`};
V.journeys=()=>`<h1>My journeys</h1>`+(S.journeys.map(j=>`<div class="card"><div class="row sp"><div><h3>${esc(j.name)}</h3><span class="mut sm">${prog(j)}% complete · ${esc(j.mode)}</span></div><div class="row"><button class="btn sm" onclick="openJ('${j.id}')">Open</button><button class="btn danger sm" onclick="delJ('${j.id}')">Delete</button></div></div></div>`).join('')||`<div class="card"><p>No journeys yet.</p></div>`)+`<a class="btn" href="#start">Start a journey</a>`;
V.documents=()=>{let h=`<h1>Documents</h1><p class="mut">Instructions you have added. They stay in this browser until you delete them.</p>`;
 const all=S.journeys.flatMap(j=>j.sources.map((s,i)=>({j,s,i})));
 h+=all.map(({j,s,i})=>`<div class="card"><div class="row sp"><div><h3>${esc(s.name)}</h3><span class="sm mut">${s.pages.length} page(s) · ${esc(j.name)}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">official link</a>`:''}</span></div><button class="btn danger sm" onclick="delJ('${j.id}')">Delete journey and document</button></div></div>`).join('')||`<div class="card"><p>No documents yet.</p></div>`;
 return h+`<a class="btn" href="#upload">Add a document</a>`};
V.settings=()=>`<h1>Settings</h1><div class="card"><h3>Your data</h3><p class="mut">Everything is saved only in this browser’s local storage. No account, no server.</p><div class="row"><button class="btn sec" onclick="exportD()">Download my data</button><button class="btn danger" onclick="wipe()">Delete all data</button></div></div>
<div class="card"><h3>Mode</h3><p>Extraction: rule-based, runs on your device. Questions: keyword retrieval. A live AI model and OCR need a backend with API keys, which this page does not have.</p></div>
<div class="card"><h3>Theme</h3><div class="row"><button class="btn sec sm" onclick="theme('light')">Light</button><button class="btn sec sm" onclick="theme('dark')">Dark</button><button class="btn sec sm" onclick="theme('')">Match device</button></div></div>`;

/* ---------- Actions ---------- */
window.setS=(id,st)=>{const j=active();const s=j.steps.find(x=>x.id===id);s.status=st;save();render();if(st==='completed')toast('Step completed')};
window.setO=o=>{const j=active();if(o&&j.steps.find(s=>s.id==='s5'||/merit|result/i.test(s.title))?.status!=='completed'&&!j.outcome){const m=j.steps.find(s=>/merit|result/i.test(s.title));if(m&&m.status!=='completed'){toast('Mark the merit-list step complete first.',1);return}}j.outcome=o;save();render()};
window.togDoc=id=>{const d=active().docs.find(x=>x.id===id);d.ready=!d.ready;save();render()};
window.openJ=id=>{S.activeId=id;save();location.hash='roadmap'};
window.delJ=id=>{if(!confirm('Delete this journey and its stored document?'))return;S.journeys=S.journeys.filter(j=>j.id!==id);if(S.activeId===id)S.activeId=S.journeys[0]?.id||null;save();render();toast('Deleted')};
window.wipe=()=>{if(!confirm('Delete everything LIFEPATH stored in this browser?'))return;S={journeys:[],activeId:null,askLog:{}};try{localStorage.removeItem(KEY)}catch(e){}render();toast('All data deleted')};
window.exportD=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lifepath-data.json';a.click()};
window.theme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme};
const STOP=new Set('the a an is are of to in on for and or what does do i my me how when where which this that it be can should there about after before with from by if am was'.split(' '));
window.ask=q=>{const j=active();if(!j)return;q=(q||'').trim();if(!q)return;const terms=q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
 const stem=w=>w.replace(/(ing|ed|es|s)$/,'');const ts=terms.map(stem);
 const hits=[];j.sources.forEach(src=>src.pages.forEach((p,i)=>p.split(/(?<=[.;])\s+|\n+/).forEach(t=>{const l=t.toLowerCase();const sc=ts.filter(w=>w.length>2&&l.includes(w)).length;if(sc>=Math.min(2,ts.length)&&sc>0)hits.push({sc,t,page:i+1,src:src.name})})));
 hits.sort((a,b)=>b.sc-a.sc);let a;
 if(!hits.length)a=`<p>I couldn’t find this information in the documents currently available. Please check the university’s official instructions or provide the relevant notice.</p>`;
 else a=`<p><strong>Passages from your documents that match your question</strong> (official text, not my wording):</p>`+hits.slice(0,3).map(h=>`<blockquote>${esc(h.t)}<br><span class="mut sm">${esc(h.src)}, page ${h.page}</span></blockquote>`).join('')+`<p class="sm"><strong>Note:</strong> I matched keywords and have not interpreted these passages. Read them as written, and confirm critical decisions on the official source.${j.demo?' This sample is fictional.':''}</p>`;
 (S.askLog[j.id]=S.askLog[j.id]||[]).push({q:esc(q)},{a});save();render();window.scrollTo(0,document.body.scrollHeight)};

function finishUpload(pages,name,url){const x=extract(pages,name);const errs=validate(x);const r=$('#review');
 if(errs.length){r.innerHTML=`<div class="card"><h3>Extraction failed</h3><p>${errs.map(esc).join('<br>')}</p><button class="btn" onclick="render()">Try again</button></div>`;toast('Extraction failed',1);return}
 const all=pages.join(' ').length;if(all<80){r.innerHTML=`<div class="card"><h3>Very little text found</h3><p>This file may be scanned. OCR is not available here, so LIFEPATH cannot read it. Paste the text instead.</p></div>`;return}
 window._x={x,pages,name,url};
 r.innerHTML=`<div class="card"><h3>Review what was found</h3>${x.low?`<div class="demo">Low confidence: ${esc(x.unc.join('; ')||'few stages detected')}. Please review before relying on this.</div>`:''}
 <p><strong>${esc(x.uni||'University not found')}</strong> · ${esc(x.course||'Programme not found')} · ${esc(x.year||'Year not found')}</p>
 <p class="sm">${x.elig.length} eligibility line(s), ${x.docs.length} document(s), ${x.steps.length} stage(s), ${x.deadlines.length} date line(s). Extracted by simple rules, all marked unverified.</p>
 ${x.steps.map(s=>`<p class="sm">• ${esc(s.title)} (page ${s.page})</p>`).join('')}${x.unc.length?`<p class="sm"><strong>Missing:</strong> ${x.unc.map(esc).join('; ')}</p>`:''}
 <label for="jn">Journey name</label><input id="jn" value="${esc((x.uni||name)+' – '+(x.course||'application'))}"><br><button class="btn" id="mk">Create roadmap</button></div>`;
 $('#mk').onclick=()=>{const{x,pages,name,url}=window._x;const sc=x.steps.length?x.steps:[];const j={id:uid(),demo:false,name:$('#jn').value||name,uni:x.uni,course:x.course,year:x.year,type:'Uploaded notice',outcome:null,mode:'Rule-based extraction (no AI)',sources:[{name,url:url||'',pages}],eligibility:x.elig,docs:x.docs,warnings:x.warn,steps:sc,deadlines:x.deadlines};S.journeys.push(j);S.activeId=j.id;save();location.hash='roadmap';toast('Roadmap created. Review it before relying on it.')}}
async function readPdf(file){const st=$('#fstat');
 if(typeof pdfjsLib==='undefined')throw new Error('The PDF reader could not load. Check your connection, or paste the text instead.');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const pages=[];
 for(let i=1;i<=pdf.numPages;i++){st.innerHTML=`<p>Reading page ${i} of ${pdf.numPages}…</p>`;const c=await(await pdf.getPage(i)).getTextContent();pages.push(c.items.map(t=>t.str).join(' ').replace(/\s+/g,' ').trim())}return pages}
function handleFile(f){const st=$('#fstat');const ok=/\.pdf$/i.test(f.name)||/^image\/(png|jpe?g)$/.test(f.type);
 if(!ok){st.innerHTML=`<p style="color:var(--err)">Unsupported file type. Use a PDF, PNG or JPG.</p>`;return}
 if(f.size>10*1048576){st.innerHTML=`<p style="color:var(--err)">File is ${(f.size/1048576).toFixed(1)} MB. The limit is 10 MB.</p>`;return}
 const info=`<p><strong>${esc(f.name)}</strong> · ${(f.size/1024).toFixed(0)} KB</p>`;
 if(!/\.pdf$/i.test(f.name)){st.innerHTML=info+`<p style="color:var(--err)">Image text reading (OCR) is not available in this version, so LIFEPATH cannot read this image. Paste the notice text below instead.</p>`;return}
 const rd=new FileReader();rd.onprogress=e=>{if(e.lengthComputable)st.innerHTML=info+`<p>Uploading ${Math.round(e.loaded/e.total*100)}%</p>`};
 rd.onload=async()=>{st.innerHTML=info+'<p>Processing…</p>';try{const pages=await readPdf(f);st.innerHTML=info+`<p style="color:var(--ok)">Text read from ${pages.length} page(s).</p>`;finishUpload(pages,f.name)}catch(e){st.innerHTML=info+`<p style="color:var(--err)">Could not read this PDF: ${esc(e.message)}</p><button class="btn sec sm" id="retry">Retry</button>`;$('#retry').onclick=()=>handleFile(f)}};
 rd.onerror=()=>{st.innerHTML=`<p style="color:var(--err)">The file could not be opened.</p>`};rd.readAsArrayBuffer(f)}
function bind(r){
 if(r==='start')$('#sf').onsubmit=e=>{e.preventDefault();const j={id:uid(),demo:false,name:$('#f3').value+' – '+$('#f4').value,uni:$('#f3').value,course:$('#f4').value,year:$('#f5').value,type:$('#f1').value,state:$('#f2').value,outcome:null,mode:'Awaiting document',sources:[{name:'No document yet',url:'',pages:[]}],eligibility:[],docs:[],warnings:[],steps:[],deadlines:[]};S.journeys.push(j);S.activeId=j.id;save();toast('Journey created. Add the official notice next.');location.hash='upload'};
 if(r==='ask')$('#af').onsubmit=e=>{e.preventDefault();ask($('#aq').value)};
 if(r==='upload'){const d=$('#drop'),f=$('#file');d.onclick=()=>f.click();d.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f.click()};f.onchange=()=>f.files[0]&&handleFile(f.files[0]);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');e.dataTransfer.files[0]&&handleFile(e.dataTransfer.files[0])};
  $('#ptb').onclick=()=>{const t=$('#ptxt').value.trim();if(t.length<40){toast('Paste more text first.',1);return}const pages=t.split(/^\s*\[Page\s*\d+\]\s*$/im).map(x=>x.trim()).filter(Boolean);finishUpload(pages,'Pasted notice')};
  $('#urlb').onclick=()=>{const u=$('#url').value.trim();if(!/^https?:\/\/\S+\.\S+/.test(u)){toast('Enter a full web address starting with https://',1);return}const j=active();if(!j){toast('Create a journey first, then save the link.',1);return}j.sources.forEach(s=>s.url=u);save();toast('Link saved as the official source for this journey')}}}

/* ---------- Router ---------- */
const NAV=[['dashboard','Dashboard'],['journeys','My Journeys'],['roadmap','Roadmap'],['checklist','Checklist'],['documents','Documents'],['upload','Add document'],['ask','Ask LIFEPATH'],['settings','Settings']];
function render(){let r=(location.hash||'#landing').slice(1);if(!V[r])r='landing';if(r==='how'){location.hash='landing';setTimeout(()=>document.getElementById('how')?.scrollIntoView(),50);return}
 const root=$('#root');
 if(r==='landing'){root.innerHTML=V.landing();return}
 root.innerHTML=`<div class="top"><a class="logo" href="#landing" style="margin:0">LIFE<b>PATH</b></a><button id="mb" aria-label="Menu">Menu</button></div><div id="app"><nav class="side" id="sn" aria-label="Main"><a class="logo" href="#landing">LIFE<b>PATH</b></a>${NAV.map(([k,l])=>`<a href="#${k}" class="${k===r?'on':''}">${l}</a>`).join('')}<p class="sm" style="color:#9fb0cf;margin:1rem .5rem">From confusion to completion.</p></nav><main id="main">${V[r]()}</main></div>`;
 $('#mb').onclick=()=>$('#sn').classList.toggle('open');$('#sn').onclick=()=>$('#sn').classList.remove('open');bind(r);window.scrollTo(0,0)}
window.render=render;addEventListener('hashchange',render);render();
</script></body></html>
